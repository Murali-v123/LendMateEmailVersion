{% extends "layouts/app.html" %}
{% block title %}Change password · LendMate{% endblock %}
{% block content %}
<header class="lm-page-header">
  <p class="lm-eyebrow">Account security</p>
  <h1 class="lm-display">Change password</h1>
</header>
<section class="lm-card" style="max-width:520px">
  <form method="post" action="{% url 'accounts:password_change' %}">
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <div class="d-flex gap-2 flex-wrap mt-2">
      <button type="submit" class="lm-btn-primary">Update password</button>
      <a href="{% url 'core:settings' %}" class="lm-btn-outline">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
