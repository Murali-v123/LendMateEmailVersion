# Render Blueprint for LendMate.
#
# Create it with: Render Dashboard > New > Blueprint > select this repository.
# Values marked "sync: false" are entered by you in the Render dashboard (never committed).
# Values marked "generateValue: true" are generated by Render.
#
# Services: web (Gunicorn), worker (Celery), beat (Celery scheduler, ONE instance only),
# a PostgreSQL database and a Redis-compatible key-value store.

services:

  - type: web
    name: lendmate-web
    runtime: python
    plan: starter
    buildCommand: >-
      pip install -r requirements.txt &&
      DJANGO_DEBUG=true DJANGO_SECRET_KEY=build-only POSTGRES_PASSWORD=build-only
      python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    healthCheckPath: /health/
    envVars: &app-env-vars
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_TIME_ZONE
        value: Asia/Kolkata
      # Render terminates TLS in front of the app. Without this, Django sees plain HTTP
      # and CSRF origin checks and secure cookies break.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: lendmate-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lendmate-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: lendmate-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: lendmate-redis
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  - type: worker
    name: lendmate-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker --loglevel=info --concurrency=2
    envVars: *app-env-vars

  - type: worker
    name: lendmate-beat
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Exactly one instance. Do not scale this service: two schedulers send duplicate reminders.
    startCommand: celery -A config beat --loglevel=info
    envVars: *app-env-vars

  - type: keyvalue
    name: lendmate-redis
    plan: starter
    ipAllowList: []   # empty = reachable only from services in this Render account
    maxmemoryPolicy: noeviction

databases:
  - name: lendmate-db
    databaseName: lendmate
    user: lendmate
    plan: basic-256mb
