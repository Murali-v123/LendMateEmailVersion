# Render Blueprint for LendMate: FREE version (web service + free database + free Redis).
#
# Create it with: Render Dashboard > New > Blueprint > select this repository.
# Values marked "sync: false" are entered by you in the Render dashboard (never committed).
# Values marked "generateValue: true" are generated by Render.
#
# Limits of the free plan:
#   - The web service sleeps after ~15 minutes idle; the first page load after that is slow.
#   - The free PostgreSQL database expires after 30 days. Export your data before then.
#   - There is no background worker on the free plan, so queued emails and the automatic
#     reminders are NOT sent. The app itself (loans, borrowers, payments, recycle bin) works.
#   - Queued notifications stay in Redis until a worker is added on a paid plan.
#
# To restore emails and reminders later, add the worker and beat services (paid plan) back.

services:

  - type: web
    name: lendmate-web
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      DJANGO_DEBUG=true DJANGO_SECRET_KEY=build-only POSTGRES_PASSWORD=build-only
      python manage.py collectstatic --noinput
    # Migrations run at startup so the free setup needs no separate pre-deploy step.
    startCommand: >-
      python manage.py migrate --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars: &app-env-vars
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_TIME_ZONE
        value: Asia/Kolkata
      # Render terminates TLS in front of the app. Without this, Django sees plain HTTP
      # and CSRF origin checks and secure cookies break.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: lendmate-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lendmate-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: lendmate-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: lendmate-redis
          property: connectionString
      # Must stay SMTP in production: the settings refuse the console backend when DEBUG is off.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  - type: keyvalue
    name: lendmate-redis
    plan: free
    ipAllowList: []   # empty = reachable only from services in this Render account
    maxmemoryPolicy: noeviction

databases:
  - name: lendmate-db
    databaseName: lendmate
    user: lendmate
    plan: free